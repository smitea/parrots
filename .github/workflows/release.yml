# Release pipeline: on a v* tag, build the release binaries + the branded
# audio driver pkg, vendor the sherpa-onnx dylibs into a source tarball, and
# publish everything as a GitHub Release. The Homebrew tap formula/cask
# (packaging/) consumes these artifacts.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Vendor sherpa-onnx shared libraries
        # sherpa-onnx publishes a macOS universal2 dylib tarball on every
        # release. Use GitHub's direct asset URL (no auth, CDN, no rate
        # limit). If upstream ever renames the asset, bump the literal below.
        env:
          SHERPA_LIBS_URL: "https://github.com/k2-fsa/sherpa-onnx/releases/latest/download/sherpa-onnx-osx-universal2-shared-lib.tar.bz2"
        run: ./scripts/download-models.sh --libs-only

      - name: Build release binaries
        run: cargo build --release --locked -p parrots-cli -p parrots-app

      - name: Build audio driver pkg
        run: |
          cd driver/macos
          ./build.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./make-pkg.sh "$VERSION"

      # Create source tarball that includes both the git tree and the
      # vendored sherpa dylibs (required for Homebrew source builds).
      # BSD tar (no GNU tar) on macos-14: use a worktree we then rename
      # under the versioned prefix, and cp -R (no rsync on this image).
      - name: Create source tarball (includes vendored dylibs)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WORKTREE="/tmp/parrots-wt"
          STAGE="/tmp/parrots-${VERSION}"
          mkdir -p "$(dirname "$STAGE")"
          git worktree add --detach "$WORKTREE" HEAD
          mv "$WORKTREE" "$STAGE"
          mkdir -p "$STAGE/vendor/sherpa-onnx/lib"
          cp -R vendor/sherpa-onnx/lib/. "$STAGE/vendor/sherpa-onnx/lib/"
          tar -C /tmp -czf "parrots-${VERSION}.tar.gz" "parrots-${VERSION}"
          rm -rf "$STAGE"
          shasum -a 256 "parrots-${VERSION}.tar.gz" | tee sha256-src.txt
          shasum -a 256 "driver/macos/build/ParrotsAudio-${VERSION}.pkg" | tee sha256-pkg.txt

      - name: Show artifacts and checksums
        run: |
          ls -lh target/release/parrots target/release/parrots-app
          cat sha256-src.txt sha256-pkg.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            parrots-*.tar.gz
            driver/macos/build/ParrotsAudio-*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Homebrew tap update snippet
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC_SHA=$(awk '{print $1}' sha256-src.txt)
          PKG_SHA=$(awk '{print $1}' sha256-pkg.txt)
          echo "::notice::Update the tap formula/cask with:"
          echo "  formula url sha256 = $SRC_SHA"
          echo "  cask   url sha256 = $PKG_SHA"
