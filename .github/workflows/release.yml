# Release pipeline: on a v* tag, build the release binaries + the branded
# audio driver pkg, vendor the sherpa-onnx dylibs into a source tarball, and
# publish everything as a GitHub Release. The Homebrew tap formula/cask
# (packaging/) consumes these artifacts.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Vendor sherpa-onnx shared libraries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Resolve the macOS universal2 shared-libs tarball URL via the gh CLI
        # (authenticated through GITHUB_TOKEN) and pass it to the download
        # script so we don't hit the anonymous 60/hr/IP rate limit.
        run: |
          set -euo pipefail
          URL=$(gh release view --repo k2-fsa/sherpa-onnx --json assets \
            -q '.assets[].browser_download_url' \
            | grep 'osx-universal2-shared-lib.*\.tar\.bz2' \
            | head -n1)
          [ -n "$URL" ] || { echo "sherpa-onnx asset not found"; exit 1; }
          echo "sherpa libs asset: $URL"
          SHERPA_LIBS_URL="$URL" ./scripts/download-models.sh --libs-only

      - name: Build release binaries
        run: cargo build --release --locked -p parrots-cli -p parrots-app

      - name: Build audio driver pkg
        run: |
          cd driver/macos
          ./build.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./make-pkg.sh "$VERSION"

      # Create source tarball that includes both the git tree and the
      # vendored sherpa dylibs (required for Homebrew source builds).
      # Uses portable POSIX tar / gzip instead of GNU tar `--transform`
      # because GitHub's macOS runners ship BSD tar without that flag.
      - name: Create source tarball (includes vendored dylibs)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Stage a clean tree at /tmp/parrots-${VERSION} with the vendored
          # dylibs layered on top. git worktree gives us HEAD's pristine
          # contents (vendor/ is gitignored, so the worktree has none);
          # we rename it under the versioned prefix the tarball expects.
          WORKTREE="/tmp/parrots-wt"
          STAGE="/tmp/parrots-${VERSION}"
          mkdir -p "$(dirname "$STAGE")"
          git worktree add --detach "$WORKTREE" HEAD
          mv "$WORKTREE" "$STAGE"
          mkdir -p "$STAGE/vendor/sherpa-onnx/lib"
          cp -R vendor/sherpa-onnx/lib/. "$STAGE/vendor/sherpa-onnx/lib/"
          # git worktree bookkeeping (worktree is now under $STAGE; clean
          # it up to avoid the "worktree contains modified files" warning)
          git -C "$STAGE" worktree remove --force "$WORKTREE" 2>/dev/null || git -C "$STAGE" worktree prune || true
          tar -C /tmp -czf "parrots-${VERSION}.tar.gz" "parrots-${VERSION}"
          rm -rf "$STAGE"
          shasum -a 256 "parrots-${VERSION}.tar.gz" | tee sha256-src.txt
          shasum -a 256 "driver/macos/build/ParrotsAudio-${VERSION}.pkg" | tee sha256-pkg.txt

      - name: Show artifacts and checksums
        run: |
          ls -lh target/release/parrots target/release/parrots-app
          cat sha256-src.txt sha256-pkg.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            parrots-*.tar.gz
            driver/macos/build/ParrotsAudio-*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Homebrew tap update snippet
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC_SHA=$(awk '{print $1}' sha256-src.txt)
          PKG_SHA=$(awk '{print $1}' sha256-pkg.txt)
          echo "::notice::Update the tap formula/cask with:"
          echo "  formula url sha256 = $SRC_SHA"
          echo "  cask   url sha256 = $PKG_SHA"
